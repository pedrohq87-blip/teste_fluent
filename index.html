<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111A2B">
<meta name="description" content="Fluent: um coach de inglês que acompanha você todos os dias.">
<meta property="og:title" content="Fluent · Conheça a plataforma">
<meta property="og:description" content="Aulas curtas, prática de conversa e um coach que cuida da sua rotina.">
<meta property="og:image" content="media/l1_card.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="media/pedro-sorrindo.png">
<title>Fluent · Conheça a plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
:root{--navy:#111A2B;--navy2:#1E2A44;--navy3:#2E3B58;--cyan:#2DD4EF;--cyan-d:#1A9FB8;--cyan-l:#E3F8FC;--cyan-t:#0D5866;--orange:#FF6A1F;--orange-d:#C94E0E;--orange-l:#FFE8DB;--orange-t:#A8430B;--bg:#F2F4F8;--line:#E1E6EE;--muted:#5F6B80;--muted2:#B8C2D6}
*{box-sizing:border-box}
html,body{margin:0;background:#E7EBF2;font-family:Montserrat,system-ui,sans-serif;color:var(--navy);-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
.page{flex:1;padding:20px 20px 110px;display:flex;flex-direction:column;gap:16px}
.page.dark{background:var(--navy);color:#fff}
h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.03em}
h2{margin:0;font-size:18px;font-weight:900}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:12px}
.logo{display:flex;align-items:flex-end;gap:3px;font-size:30px;font-weight:900;line-height:1}
.logo i{width:9px;height:9px;border-radius:5px;background:var(--orange);margin-bottom:3px;display:block}
.chip-streak{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:#fff;font-size:14px;font-weight:900}
.dark .chip-streak{background:#2A2620;color:#FF9A5E}
.avbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--navy);color:var(--cyan);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center}
.dark .avbtn{background:var(--navy2)}
.card{background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.dk{background:var(--navy2);color:#fff}
.muted{color:var(--muted);font-size:14px;font-weight:600;line-height:1.45}
.dark .muted,.card.dk .muted{color:var(--muted2)}
.dark .card:not(.dk) .muted{color:var(--muted)}
.small{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:none;font-size:16px;font-weight:900;text-decoration:none;color:var(--navy);width:100%}
.btn.or{background:var(--orange);box-shadow:0 5px 0 var(--orange-d)}
.btn.cy{background:var(--cyan);box-shadow:0 5px 0 var(--cyan-d)}
.btn.wh{background:#fff;box-shadow:0 5px 0 var(--line)}
.btn.gh{background:transparent;min-height:48px;color:var(--muted)}
.dark .btn.gh{color:var(--muted2)}
.btn.dk{background:var(--navy2);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn[disabled]{opacity:.45}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.iconbox{width:52px;height:52px;flex-shrink:0;border-radius:16px;display:flex;align-items:center;justify-content:center}
.ib-c{background:var(--cyan-l)}.ib-o{background:var(--orange-l)}.ib-n{background:var(--navy)}.ib-g{background:#EEF1F6}
.back{width:48px;height:48px;flex-shrink:0;border-radius:16px;border:none;background:#fff;display:flex;align-items:center;justify-content:center}
.dark .back{background:var(--navy2)}
nav.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--navy);padding:8px 6px 14px;border-radius:26px 26px 0 0;z-index:5}
nav.bar a{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:800;color:var(--muted2);text-decoration:none}
nav.bar a span.pill{width:56px;height:40px;border-radius:16px;display:flex;align-items:center;justify-content:center}
nav.bar a.on{color:#fff}nav.bar a.on span.pill{background:var(--cyan)}
.nav-av{width:32px;height:32px;border-radius:16px;overflow:hidden;background:var(--cyan)}
.nav-av img{width:100%;height:100%;display:block}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--muted)}
.field input{min-height:52px;border-radius:16px;border:2px solid var(--line);background:#fff;padding:0 16px;font-size:16px;font-weight:600;color:var(--navy);outline:none}
.field input:focus{border-color:var(--cyan)}
.err{color:#B3261E;font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;top:16px;pointer-events:none;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:800;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.lesson-card{border-radius:24px;background:#fff;overflow:hidden;border:none;padding:0;text-align:left;width:100%;display:block}
.lesson-card.now{box-shadow:0 0 0 3px var(--orange)}
.lesson-card img{display:block;width:100%;height:130px;object-fit:cover}
.lrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:20px;background:#fff;border:none;width:100%;text-align:left}
.lrow.lock{background:#E8ECF2;color:#4F5A6E}
.lrow img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0}
.ln{width:56px;height:56px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#DCE1E9;font-weight:900;font-size:18px;color:#4F5A6E}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.st{position:relative;aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center}
.st .ok{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:10px;background:var(--cyan);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.steprow{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 12px 8px 8px;border-radius:20px;background:#fff;border:none;width:100%;text-align:left}
.steprow.cur{box-shadow:0 0 0 3px var(--orange)}
.unit-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.unit-h b{width:30px;height:30px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.prog{height:10px;border-radius:5px;background:#E1E6EE;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--cyan);border-radius:5px}
.dark .prog{background:#24314D}
.opt{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 16px 8px 8px;border-radius:20px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:17px;font-weight:800;text-align:left;width:100%}
.opt .k{width:42px;height:42px;flex-shrink:0;border-radius:13px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900}
.opt.sel{border-color:var(--navy)}
.opt.right{background:var(--cyan-l);border-color:var(--cyan);box-shadow:0 4px 0 var(--cyan)}
.opt.wrong{background:var(--orange-l);border-color:var(--orange);box-shadow:0 4px 0 var(--orange)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{min-height:48px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.ansline{min-height:64px;border-radius:18px;border:2px dashed #C9D1DE;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ansline .wchip{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:none}
.fb{border-radius:22px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--cyan-l)}.fb.no{background:var(--orange-l)}
.fb img{width:48px;height:48px;border-radius:24px;flex-shrink:0}
.flash{flex:1;min-height:360px;background:#fff;border-radius:32px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;border:none;width:100%}
.flash .en{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.flash .pr{font-size:19px;font-weight:900;padding:6px 14px;border-radius:12px;background:var(--cyan)}
.flash .ipa{font-family:'DejaVu Sans',Arial,sans-serif;font-size:17px;color:var(--muted)}
.flash .pt{font-size:26px;font-weight:800;color:var(--cyan-t)}
.speak{width:80px;height:80px;border-radius:40px;border:none;background:var(--orange);box-shadow:0 6px 0 var(--orange-d);display:flex;align-items:center;justify-content:center}
video{width:100%;border-radius:22px;background:#000;display:block;max-height:62vh}
.stage{position:relative;height:230px;border-radius:28px;background:var(--navy);overflow:hidden;flex-shrink:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .who{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;color:#fff;font-size:12px;font-weight:800}
.stage .who img{width:36px;height:36px;border-radius:18px}
.stage .stt{position:absolute;right:14px;top:20px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--muted2)}
.stage .stt i{width:8px;height:8px;border-radius:4px;background:var(--orange);display:block}
.glog{display:flex;flex-direction:column;gap:10px}
.b-c{align-self:flex-start;background:#fff;border-radius:22px 22px 22px 6px;padding:12px 16px;max-width:88%;font-size:16px;font-weight:700;line-height:1.4}
.b-u{align-self:flex-end;background:var(--navy);color:#fff;border-radius:22px 22px 6px 22px;padding:12px 16px;max-width:88%;font-size:16px;font-weight:700;line-height:1.4}
.b-t{align-self:stretch;background:var(--cyan-l);border:2px solid var(--cyan);border-radius:18px;padding:12px 14px;font-size:15px;font-weight:800;white-space:pre-line}
.ginput{background:var(--navy);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gchip{min-height:52px;border-radius:16px;border:2px solid var(--navy3);background:var(--navy2);color:#fff;font-size:15px;font-weight:800;text-align:left;padding:8px 14px;width:100%}
.gtools{display:flex;gap:10px;align-items:center;justify-content:center}
.gtools button{width:56px;height:56px;border-radius:18px;border:2px solid var(--navy3);background:var(--navy2);display:flex;align-items:center;justify-content:center}
.gtools button.mic{width:72px;height:72px;border-radius:36px;border:none;background:var(--orange);box-shadow:0 5px 0 var(--orange-d)}
.gtools button.mic.on{background:var(--cyan);box-shadow:0 5px 0 var(--cyan-d)}
.gtype{display:flex;gap:8px}
.gtype input{flex:1;min-height:50px;border-radius:14px;border:2px solid var(--navy3);background:var(--navy2);color:#fff;padding:0 14px;font-size:16px;font-weight:600;outline:none}
.gtype button{min-width:50px;border-radius:14px;border:none;background:var(--cyan)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#fff;border-radius:22px;padding:14px;display:flex;align-items:center;gap:12px}
.tile .v{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.tile .l{font-size:12px;font-weight:700;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:130px}
.chart div{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:130px}
.chart i{width:100%;border-radius:8px;background:var(--cyan);display:block}
.chart b{font-size:11px;font-weight:900;color:var(--muted)}
.chart span{font-size:11px;font-weight:800;color:var(--muted)}
.seg{display:grid;gap:8px}
.segb{min-height:60px;border-radius:16px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}
.segb.on{border-color:var(--navy);background:var(--navy);color:#fff}
.segb.onc{border-color:var(--cyan);background:var(--cyan-l);color:var(--navy)}
.segb.ono{border-color:var(--orange);background:var(--orange-l);color:var(--navy)}
.timein{flex:1;min-height:48px;border-radius:14px;border:none;background:var(--cyan-l);color:var(--cyan-t);font-size:16px;font-weight:900;text-align:center}
.hero{position:relative;height:300px;margin:0 -20px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero img{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:75px}
.speech{position:relative;background:#fff;color:var(--navy);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.speech:before{content:'';position:absolute;left:50%;top:-9px;width:18px;height:18px;margin-left:-9px;background:#fff;transform:rotate(45deg)}
.overlay{position:fixed;inset:0;background:rgba(17,26,43,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.dialog{background:#fff;border-radius:24px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.timer{height:8px;border-radius:4px;background:#E1E6EE;overflow:hidden}
.timer i{display:block;height:100%;background:var(--orange);transition:width .1s linear}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.center{text-align:center}
.vocab-tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--cyan-t)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// ---------------- ícones ----------------
const P = {
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  chart:'<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',

  podcast:'<circle cx="12" cy="11" r="3"/><path d="M12 14v7"/><path d="M7.8 15.5a6 6 0 1 1 8.4 0"/><path d="M5 18.5a10 10 0 1 1 14 0"/>',
  shuffle:'<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/>',
  keyboard:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',

  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  l1:'<path d="M5 20v-4"/><path d="M12 20v-9" stroke-opacity=".25"/><path d="M19 20V5" stroke-opacity=".25"/>',
  l2:'<path d="M5 20v-4M12 20v-9"/><path d="M19 20V5" stroke-opacity=".25"/>',
  l3:'<path d="M5 20v-4M12 20v-9M19 20V5"/>'
};
const ic = (n, s = 22, c = '#111A2B', w = 2.2, f = 'none') => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

// ---------------- conteúdo ----------------
const TRACK = [
  { t: 'Primeiros contatos', l: ['Falar de você e do que você faz', 'Pedir comida no restaurante', 'Cumprimentar e se despedir', 'Falar de outras pessoas', 'Trocar contatos', 'Revisão + desafio: apresente-se para um colega novo'] },
  { t: 'Pessoas e lugares', l: ['Apresentar a sua família', 'Descrever pessoas', 'Falar da sua casa', 'Dizer onde as coisas estão', 'Falar da sua cidade', 'Revisão + desafio: mostre a sua casa e o seu bairro'] },

  { t: 'Sair e viajar', l: ['Usar o transporte', 'Pedir informações na rua', 'Fazer check-in no hotel', 'Passar pela imigração no aeroporto', 'Falar do tempo e das estações', 'Revisão + desafio: chegue a uma cidade nova'] },

];
const TOTAL = 36;

// ---------------- overlays (telas de estudo) ----------------
function openStep(n, sid) {
  const s = LESSONS[n].steps.find(x => x.id === sid);
  if (s.type === 'video') V.overlay = { type: 'video', n, s };
  else if (s.type === 'vocab') V.overlay = { type: 'vocab', n, s, i: 0, flip: false, showVideo: !stepDone(n, s.id) };
  else if (s.type === 'ex') V.overlay = { type: 'ex', n, items: LESSONS[n].ex.slice(), title: 'Exercícios · Lição ' + n, mode: 'lesson' };
  else if (s.type === 'conv') { startGame(s.game); return; }
  if (V.overlay.type === 'ex') initEx();
  render();
}
function renderOverlay() {
  const o = V.overlay;
  if (o.type === 'video') app.innerHTML = vVideo(o);
  else if (o.type === 'vocab') app.innerHTML = vVocab(o);
  else if (o.type === 'ex') app.innerHTML = vEx();
  else if (o.type === 'result') app.innerHTML = vResult(o);
  else if (o.type === 'game') { renderGame(); return; }
  else if (o.type === 'quiz') app.innerHTML = vQuiz();
  else if (o.type === 'games') app.innerHTML = vGames();

  mountClouds();
  window.scrollTo(0, 0);
}

// ---------------- mix e quiz ----------------
function buildMix(focus) {
  const pool = [];
  [1, 2].forEach(n => { if (n === 1 || lessonStarted(2) || lessonDone(1)) LESSONS[n].ex.forEach(x => pool.push(x)); });
  const errTags = Object.keys(U.errors).sort((a, b) => U.errors[b] - U.errors[a]);
  let picks = pool.filter(x => errTags.includes(x.tag));
  picks = shuffle(picks).slice(0, focus ? 6 : 3);
  const rest = shuffle(pool.filter(x => !picks.includes(x)));
  while (picks.length < 6 && rest.length) picks.push(rest.pop());
  const deckPool = VOC.l1.concat(lessonStarted(2) || lessonDone(1) ? VOC.l2a.concat(VOC.l2b) : []);
  shuffle(deckPool).slice(0, 2).forEach(c => {
    const wrong = shuffle(deckPool.filter(d => d.pt !== c.pt)).slice(0, 2).map(d => d.pt);
    const o = shuffle([c.pt, ...wrong]);
    picks.push({ t: 'listen', tag: 'Vocabulário', q: `O que significa “${c.en}”?`, audio: c.audio, o, a: o.indexOf(c.pt), ok: `${c.en}: ${c.pt}.`, no: `${c.en} quer dizer ${c.pt}.` });
  });
  return shuffle(picks);
}
const QZ = { i: 0, items: [], score: 0, right: 0, left: 1, timer: null, ans: null };
function startQuiz() {
  const pool = VOC.l1.concat(lessonStarted(2) || lessonDone(1) ? VOC.l2a.concat(VOC.l2b) : []);
  QZ.items = shuffle(pool).slice(0, 10).map(c => { const o = shuffle([c.pt, ...shuffle(pool.filter(d => d.pt !== c.pt)).slice(0, 2).map(d => d.pt)]); return { c, o, a: o.indexOf(c.pt) }; });
  QZ.i = 0; QZ.score = 0; QZ.right = 0; QZ.ans = null; V.overlay = { type: 'quiz' }; render(); quizTick();
}
function quizTick() {
  clearInterval(QZ.timer); QZ.left = 1; const t0 = Date.now();
  QZ.timer = setInterval(() => {
    if (!V.overlay || V.overlay.type !== 'quiz') { clearInterval(QZ.timer); return; }
    QZ.left = Math.max(0, 1 - (Date.now() - t0) / 8000);
    const bar = document.getElementById('qbar'); if (bar) bar.style.width = (QZ.left * 100) + '%';
    if (QZ.left <= 0) { clearInterval(QZ.timer); quizAnswer(-1); }
  }, 100);
}
function quizAnswer(k) {
  if (QZ.ans != null) return; clearInterval(QZ.timer);
  const it = QZ.items[QZ.i]; QZ.ans = k; const ok = k === it.a;
  if (ok) { QZ.right++; QZ.score += Math.round(50 + 50 * QZ.left); }
  logAnswer(ok, ok ? null : 'Vocabulário');
  render();
  setTimeout(() => {
    if (!V.overlay || V.overlay.type !== 'quiz') return;
    QZ.i++; QZ.ans = null;
    if (QZ.i >= QZ.items.length) { V.overlay = { type: 'result', score: QZ.right, total: QZ.items.length, sub: `Quiz rápido: ${QZ.score} pontos`, tags: [], next: { act: 'quiz', label: 'Jogar de novo', icon: 'redo' } }; render(); }
    else { render(); quizTick(); }
  }, ok ? 700 : 1400);
}
function vQuiz() {
  const it = QZ.items[QZ.i]; if (!it) return '';
  return `<div class="page" style="padding-bottom:30px">
  ${head('Quiz rápido', `<span class="chip-streak">${ic('star', 18, '#FF6A1F', 2, '#FF6A1F')}${QZ.score}</span>`)}
  <div class="timer" role="img" aria-label="Tempo"><i id="qbar" style="width:${QZ.left * 100}%"></i></div>
  <p class="small center">PERGUNTA ${QZ.i + 1} DE ${QZ.items.length}</p>
  <div class="flash" style="min-height:220px;flex:none"><span class="en" style="font-size:40px">${esc(it.c.en)}</span><button class="speak" style="width:60px;height:60px" data-act="say" data-src="${it.c.audio}" aria-label="Ouvir">${ic('speaker', 28, '#111A2B', 2.2)}</button></div>
  <div style="display:flex;flex-direction:column;gap:12px">${it.o.map((op, k) => { let cls = 'opt'; if (QZ.ans != null) { if (k === it.a) cls += ' right'; else if (k === QZ.ans) cls += ' wrong'; } return `<button class="${cls}" data-act="qpick" data-k="${k}"${QZ.ans != null ? ' disabled' : ''} style="justify-content:center;font-size:19px">${esc(op)}</button>`; }).join('')}</div>
</div>`;
}

function gLine(id) { return G.def.audio ? (VOC.jogo[id] || '') : (G.def.lines[id] || ''); }
async function say(id) {
  const text = gLine(id); G.log.push({ r: 'c', t: text }); G.status = 'speaking'; CLOUD.mode = 'coach'; gameUpdate(); gameInput();
  if (G.def.audio) { ensureAudioGraph(); await playClip('media/l2coach/' + id + '.mp3'); }

}
async function ask() {
  const st = G.def.stages[G.i];
  await say(G.repeat ? st.model : st.ask);

async function gameStart() { ensureAudioGraph(); if (G.def.audio) preload(Object.keys(VOC.jogo || {}).map(k => 'media/l2coach/' + k + '.mp3')); G.status = 'speaking'; if (G.def.intro) await say(G.def.intro); await ask(); }

  const st = G.def.stages[G.i]; const t = norm(raw);

  await new Promise(r => setTimeout(r, 650));
  if (!t.trim()) { await say(G.def.retry); G.status = 'answer'; gameUpdate(); gameInput(); return; }
  const r = st.check(t);
  if (st.final) {
    if (r === OK || G.finalTries >= 1) { G.stars[G.i] = r === OK && G.finalTries === 0; logAnswer(r === OK, 'Apresentação completa'); if (r === OK) await say('L22'); return finish(); }

  logAnswer(false, G.gid === 'l2' ? ['Roteiro do restaurante', 'Roteiro do restaurante', "I'd like", "I'd like", 'Roteiro do restaurante', 'the bill'][G.i] : ['I\'m', 'I live in', 'a / an', 'I work', 'I love'][G.i]);
  if ((G.gid === 'l2' && (r === 'C9' || r === 'C6')) ) { await say(r); await say(st.praise); return nextStage(); }
  G.tries++;

}
function micMsg(e) {
  e = String(e || '');
  if (/not-allowed|service-not-allowed/.test(e)) return 'Permita o uso do microfone para este site nas configurações do navegador.';
  if (/network|language/.test(e)) return 'O reconhecimento de voz não funciona neste navegador. Use o Chrome ou o Safari, ou escolha a resposta.';
  if (/audio-capture/.test(e)) return 'Não encontrei um microfone. Escolha ou digite a resposta.';
  return 'Não consegui ouvir. Tente de novo, escolha ou digite a resposta.';
}
function startDictation() {
  if (!DICT) return;
  DICTTXT = ''; DICTON = true; CLOUD.mode = 'aluno';
  let p;
  try { p = DICT.start(); } catch (e) { DICTON = false; CLOUD.mode = 'idle'; G.typing = true; gameInput(); return; }
  gameInput(); gameUpdate();
  if (!startDictation.wired) {
    startDictation.wired = true;
    DICT.onPartial(({ text }) => { if (DICTON) { const el = document.querySelector('#ginput p'); if (el) el.textContent = (DICTTXT + ' ' + text).trim(); } });
    DICT.onFinal(({ text }) => { if (DICTON) DICTTXT = (DICTTXT + ' ' + text).trim(); });
    DICT.onState(({ state, error }) => {
      if (state !== 'idle' || !DICTON) return;
      DICTON = false; CLOUD.mode = 'idle'; const txt = DICTTXT; DICTTXT = '';

}

  if (a === 'flip') { V.overlay.flip = !V.overlay.flip; render(); return; }
  if (a === 'card') {
    const o = V.overlay, deck = VOC[o.s.deck]; U.cards[o.s.deck + ':' + o.i] = b.dataset.v; touchDay(); save();
    if (o.i + 1 < deck.length) { o.i++; o.flip = false; render(); }
    else { if (!stepDone(o.n, o.s.id)) markStep(o.n, o.s.id); const known = Object.keys(U.cards).filter(x => x.startsWith(o.s.deck + ':') && U.cards[x] === 'k').length; V.overlay = { type: 'result', score: known, total: deck.length, sub: 'Palavras que você já sabe', tags: [], next: nextStepAction(o.n, o.s.id) }; render(); }
    return;
  }
  if (a === 'pick') { EX.sel = +b.dataset.k; render(); return; }
  if (a === 'order') { EX.order.push(+b.dataset.k); render(); return; }
  if (a === 'unorder') { EX.order.splice(+b.dataset.j, 1); render(); return; }
  if (a === 'ex-check') {
    const x = V.overlay.items[EX.i]; EX.checked = true; const ok = isRight(); if (ok) EX.right++; else EX.wrongTags.push(x.tag);
    logAnswer(ok, x.tag); render(); return;
  }
  if (a === 'ex-next') {
    const o = V.overlay;
    if (EX.i + 1 < o.items.length) { EX.i++; EX.sel = null; EX.order = []; EX.checked = false; render(); return; }
    const tags = [...new Set(EX.wrongTags)];
    if (o.mode === 'lesson') { markStep(o.n, 'ex', { score: EX.right, total: o.items.length }); V.overlay = { type: 'result', score: EX.right, total: o.items.length, sub: 'Exercícios da Lição ' + o.n + ' concluídos', tags, next: nextStepAction(o.n, 'ex') }; }
    else V.overlay = { type: 'result', score: EX.right, total: o.items.length, sub: 'Mix do dia concluído', tags, next: { act: 'game', g: 'l2', label: 'Treinar conversa', icon: 'mic' } };
    render(); return;
  }
  if (a === 'mix' || a === 'mix-err') {
    if (!VOC.l1.length) { toast('Carregando o conteúdo…'); return; }
    V.overlay = { type: 'ex', items: buildMix(a === 'mix-err'), title: a === 'mix' ? 'Mix do dia' : 'Revisão dos erros', mode: 'mix' }; initEx(); render(); return;
  }
  if (a === 'quiz') { if (!VOC.l1.length) { toast('Carregando o conteúdo…'); return; } startQuiz(); return; }
  if (a === 'qpick') { quizAnswer(+b.dataset.k); return; }
  if (a === 'podcast') { toast('Os podcasts de 2 minutos chegam em breve.'); return; }
  if (a === 'game') { if (b.dataset.g) startGame(b.dataset.g); else { V.overlay = { type: 'games' }; render(); } return; }
  if (a === 'gstart') { gameStart(); return; }
  if (a === 'ganswer') { evaluate(b.dataset.t); return; }
  if (a === 'gtype') { G.typing = !G.typing; gameInput(); return; }
  if (a === 'ghelp') { const st = G.def.stages[G.i]; G.log.push({ r: 't', t: 'Modelo: ' + st.tpl }); gameUpdate(); return; }
  if (a === 'plan-per') { U.plan.perDay = +b.dataset.v; save(); render(); toast('Plano salvo'); return; }
  if (a === 'plan-type') { const k = b.dataset.v; U.plan.types[k] = !U.plan.types[k]; save(); render(); toast('Plano salvo'); return; }
  if (a === 'plan-level') { U.plan.level = +b.dataset.v; save(); render(); toast('Plano salvo'); return; }
  if (a === 'logout') { U = null; ME = null; LS.set('fluent_visit', null); location.hash = 'login'; render(); return; }
  if (a === 'reset') { V.overlay = { type: 'confirm' }; render(); return; }
  if (a === 'reset-ok') { const acc = { key: U.key, name: U.name, email: U.email }; U = blankUser(acc); seedLesson1(U); save(true); V.overlay = null; go('coach'); toast('Progresso apagado'); return; }
});
function nextStepAction(n, sid) {
  const L = LESSONS[n]; const i = L.steps.findIndex(s => s.id === sid); const nx = L.steps.slice(i + 1).find(s => !stepDone(n, s.id));
  return nx ? { act: 'open-step', n, s: nx.id, label: 'Próximo: ' + nx.label.split(':')[0], icon: nx.icon } : null;
}
document.addEventListener('change', e => {
  const t = e.target; if (t.dataset.act === 'plan-time') { U.plan.times[+t.dataset.i] = t.value || U.plan.times[+t.dataset.i]; save(); toast('Plano salvo'); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'gform') { const v = document.getElementById('gtxt').value.trim(); if (!v) { toast('Escreva a sua resposta em inglês.'); return; } evaluate(v); return; }
  if (e.target.id === 'visit') {
    const name = (String(new FormData(e.target).get('name') || '').trim().split(/\s+/)[0] || 'Visitante').slice(0, 20);
    const acc = { key: 'v' + Date.now().toString(36), name: name[0].toUpperCase() + name.slice(1), email: '' };
    LS.set('fluent_visit', acc); INTRO_NAME = false; doLogin(acc); return;
  }
  if (e.target.id === 'login') {
    const f = new FormData(e.target); const email = String(f.get('email') || '').trim().toLowerCase(), pass = String(f.get('pass') || ''), name = String(f.get('name') || '').trim();
    if (SIGNUP) {
      if (!name || !/^\S+@\S+\.\S+$/.test(email)) { LOGINERR = 'Preencha o seu nome e um e-mail válido.'; render(); return; }
      if (pass.length < 6) { LOGINERR = 'A senha precisa de pelo menos 6 caracteres.'; render(); return; }
      if (accounts().some(a => a.email === email)) { LOGINERR = 'Este e-mail já tem conta. Entre com ele.'; render(); return; }
      const acc = { key: 'u' + Date.now().toString(36), name, email };
      const extra = LS.get('fluent_accounts') || []; extra.push(acc); LS.set('fluent_accounts', extra); doLogin(acc); return;
    }
    const acc = accounts().find(a => a.email === email);
    if (!acc) { LOGINERR = 'Não encontramos esse e-mail. Use uma conta de teste ou crie uma conta.'; render(); return; }
    if (TEST.includes(acc) && pass !== PASS) { LOGINERR = 'Senha incorreta. A senha das contas de teste é fluent123.'; render(); return; }
    doLogin(acc);
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

// ---------------- início ----------------
fetch('vocab.json').then(r => r.json()).then(d => { VOC = d; if (V.overlay) renderOverlay(); }).catch(() => {});
(async () => {
  const acc = LS.get('fluent_visit');
  if (acc) { await doLogin(acc); } else render();
})();
</script>
